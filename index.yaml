      version: 3.4.0
    description: 'Helm chart for Cilium network policies of one namespace. Puts every
      pod of the namespace in default deny, then opens only the flows the app declares:
      Kubernetes API, Internet, FQDNs, CIDRs and pods, each with the reason it exists.
      Flows shared by every app (DNS, gateway, scrape) belong to a cluster-wide baseline,
      not here.'
