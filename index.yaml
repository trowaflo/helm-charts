  common:
  - apiVersion: v2
    created: "2026-10-25T21:12:55.363759648Z"
    description: Common library chart providing reusable Helm templates and default
      configurations. Standardizes Kubernetes resource deployment (Deployments, StatefulSets,
      DaemonSets, CronJobs, Jobs, Services, Ingress, ServiceMonitor, PersistentVolumes,
      PersistentVolumeClaims, CNPG Clusters, CiliumNetworkPolicies) across the chart
      repository with consistent security, observability, and best practices.  Used
      by all application charts in this repository for consistency.
    digest: a84c23590c4928646a067e430e4bd5e2a5b7b92d94d58e98b0db667da6a1271d
