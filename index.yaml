  kgateway-routing:
  - apiVersion: v2
    created: "2026-10-25T21:03:59.996763402Z"
    description: Helm chart for managing Kubernetes Gateway API HTTPRoute and Backend
      resources. Supports both in-cluster (Service) and out-of-cluster (Backend) routing
      with request/response filters, header modification, and flexible path matching.
    digest: 80b8f712afece4f0702052ba429ca47b9dd9f62ad1bc222b2bf9127c3e8f31d3
    keywords:
    - kubernetes
