suite: test backendconfigpolicy
templates:
  - templates/backendconfigpolicy.yaml
tests:
  - it: should not render when route disabled
    set:
      routes:
        test:
          enabled: false
          outCluster:
            - name: test
              host: test.com
              port: 80
              tls: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when no TLS enabled on backends
    set:
      routes:
        test:
          enabled: true
          hostnames: ["test.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          outCluster:
            - name: test
              host: test.local
              port: 80
    asserts:
      - hasDocuments:
          count: 0

  - it: should render backendconfigpolicy with TLS enabled on backend
    set:
      routes:
        pmxx:
          enabled: true
          hostnames: ["pmxx.example.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          outCluster:
            - name: pmxx
              host: proxmox1.example.com
              port: 8006
              tls: true
              insecure: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: BackendConfigPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pmxx-pmxx-policy
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: spec.targetRefs[0].group
          value: gateway.kgateway.dev
      - equal:
          path: spec.targetRefs[0].kind
          value: Backend
      - equal:
          path: spec.targetRefs[0].name
          value: pmxx-pmxx-backend
      - equal:
          path: spec.tls.sni
          value: proxmox1.example.com
      - equal:
          path: spec.tls.insecureSkipVerify
          value: true
      - notExists:
          path: spec.tls.wellKnownCACertificates

  - it: should verify against the system CA pool when not insecure
    set:
      routes:
        pmxx:
          enabled: true
          hostnames: ["pmxx.example.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          outCluster:
            - name: pmxx
              host: proxmox1.example.com
              port: 8006
              tls: true
    asserts:
      - equal:
          path: spec.tls.wellKnownCACertificates
          value: System
      - notExists:
          path: spec.tls.insecureSkipVerify

  - it: should auto-derive SNI from host
    set:
      routes:
        test:
          enabled: true
          hostnames: ["test.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          outCluster:
            - name: test
              host: test.local
              port: 443
              tls: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.tls.sni
          value: test.local
      - isNull:
          path: spec.tls.insecureSkipVerify

  - it: should support insecure flag
    set:
      routes:
        test:
          enabled: true
          hostnames: ["test.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          outCluster:
            - name: test
              host: test.local
              port: 443
              tls: true
              insecure: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.tls.sni
          value: test.local
      - isNull:
          path: spec.tls.insecureSkipVerify

  - it: should only create policy for backends with TLS enabled
    set:
      routes:
        multi:
          enabled: true
          hostnames: ["multi.example.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          outCluster:
            - name: backend1
              host: host1.local
              port: 8080
              tls: true
            - name: backend2
              host: host2.local
              port: 8080
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.targetRefs[0].name
          value: multi-backend1-backend
      - isNull:
          path: spec.targetRefs[1]

  - it: should render backendconfigpolicy for inCluster with TLS enabled
    set:
      routes:
        api:
          enabled: true
          hostnames: ["api.example.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          inCluster:
            - name: api-service
              port: 8443
              tls: true
              insecure: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: BackendConfigPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-api-api-service-policy
      - equal:
          path: spec.targetRefs[0].group
          value: ""
      - equal:
          path: spec.targetRefs[0].kind
          value: Service
      - equal:
          path: spec.targetRefs[0].name
          value: api-service
      - equal:
          path: spec.tls.sni
          value: api-service
      - equal:
          path: spec.tls.insecureSkipVerify
          value: true

  - it: should use custom SNI for inCluster when provided
    set:
      routes:
        api:
          enabled: true
          hostnames: ["api.example.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          inCluster:
            - name: api-service
              port: 8443
              tls: true
              sni: api-service.default.svc.cluster.local
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.tls.sni
          value: api-service.default.svc.cluster.local
      - isNull:
          path: spec.tls.insecureSkipVerify

  - it: should support mixed inCluster and outCluster with TLS
    set:
      routes:
        mixed:
          enabled: true
          hostnames: ["mixed.example.com"]
          parentRefs:
            - name: gateway
              namespace: kgateway-system
          inCluster:
            - name: internal-api
              port: 8443
              tls: true
              insecure: true
          outCluster:
            - name: external-api
              host: external.example.com
              port: 443
              tls: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.targetRefs[0].kind
          value: Backend
        documentIndex: 0
      - equal:
          path: spec.targetRefs[0].name
          value: mixed-external-api-backend
        documentIndex: 0
      - equal:
          path: spec.tls.sni
          value: external.example.com
        documentIndex: 0
      - isNull:
          path: spec.tls.insecureSkipVerify
        documentIndex: 0
      - equal:
          path: spec.targetRefs[0].kind
          value: Service
        documentIndex: 1
      - equal:
          path: spec.targetRefs[0].name
          value: internal-api
        documentIndex: 1
      - equal:
          path: spec.tls.sni
          value: internal-api
        documentIndex: 1
      - equal:
          path: spec.tls.insecureSkipVerify
          value: true
        documentIndex: 1

  # Regression: the shared policy used to give the first backend's sni and
  # insecure flag to every target of the route.
  - it: should give each outCluster TLS target its own sni and insecure flag
    set:
      routes:
        multi:
          enabled: true
          outCluster:
            - name: one
              host: one.example.com
              port: 443
              tls: true
              insecure: true
            - name: two
              host: two.example.com
              port: 443
              tls: true
    asserts:
      - hasDocuments:
          count: 2
      - lengthEqual:
          path: spec.targetRefs
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-multi-one-policy
        documentIndex: 0
      - equal:
          path: spec.targetRefs[0].name
          value: multi-one-backend
        documentIndex: 0
      - equal:
          path: spec.tls.sni
          value: one.example.com
        documentIndex: 0
      - equal:
          path: spec.tls.insecureSkipVerify
          value: true
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-multi-two-policy
        documentIndex: 1
      - equal:
          path: spec.targetRefs[0].name
          value: multi-two-backend
        documentIndex: 1
      - equal:
          path: spec.tls.sni
          value: two.example.com
        documentIndex: 1
      - isNull:
          path: spec.tls.insecureSkipVerify
        documentIndex: 1

  - it: should fail when two TLS backends would share a policy name
    set:
      routes:
        dup:
          enabled: true
          inCluster:
            - name: api
              port: 443
              tls: true
          outCluster:
            - name: api
              host: api.example.com
              port: 443
              tls: true
    asserts:
      - failedTemplate:
          errorMessage: "routes.dup: two TLS backends produce the BackendConfigPolicy NAMESPACE/RELEASE-NAME-dup-api-policy; give them distinct names"

  # Route `a` + backend `b-c` and route `a-b` + backend `c` both give
  # <release>-a-b-c-policy: the collision check must span routes.
  - it: should fail when two routes would share a policy name in one namespace
    set:
      routes:
        a:
          enabled: true
          inCluster:
            - name: b-c
              port: 443
              tls: true
        a-b:
          enabled: true
          inCluster:
            - name: c
              port: 443
              tls: true
    asserts:
      - failedTemplate:
          errorMessage: "routes.a-b: two TLS backends produce the BackendConfigPolicy NAMESPACE/RELEASE-NAME-a-b-c-policy; give them distinct names"

  - it: should accept the same policy name in two namespaces
    set:
      routes:
        a:
          enabled: true
          inCluster:
            - name: b-c
              port: 443
              tls: true
        a-b:
          enabled: true
          namespace: other
          inCluster:
            - name: c
              port: 443
              tls: true
    asserts:
      - hasDocuments:
          count: 2
