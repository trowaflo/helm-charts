{{- $namespace := include "kgateway-routing.namespace" . -}}
{{- $routeKeys := keys .Values.routes | sortAlpha -}}
{{- range $routeKey := $routeKeys }}
{{- $route := index $.Values.routes $routeKey }}
{{- if $route.enabled }}
{{- $routeNamespace := default $namespace $route.namespace }}
{{- /* One policy per TLS target: sni and insecureSkipVerify belong to one backend, */ -}}
{{- /* a shared policy would hand the first backend's sni to every other target. */ -}}
{{- /* LocalPolicyTargetReference has no namespace field, so the policy lives in the */ -}}
{{- /* target namespace. */ -}}
{{- $targets := list }}
{{- range $backend := $route.outCluster }}
  {{- if $backend.tls }}
    {{- $targets = append $targets (dict
        "group" "gateway.kgateway.dev"
        "kind" "Backend"
        "name" (printf "%s-%s-backend" $routeKey $backend.name)
        "backend" $backend) }}
  {{- end }}
{{- end }}
{{- range $backend := $route.inCluster }}
  {{- if $backend.tls }}
    {{- $targets = append $targets (dict "group" "" "kind" "Service" "name" $backend.name "backend" $backend) }}
  {{- end }}
{{- end }}
{{- $seen := dict }}
{{- range $target := $targets }}
{{- $backend := $target.backend }}
{{- $bcpNs := default $routeNamespace $backend.namespace }}
{{- $bcpName := printf "%s-%s-%s-policy" $.Release.Name $routeKey $backend.name | trunc 63 | trimSuffix "-" }}
{{- $seenKey := printf "%s/%s" $bcpNs $bcpName }}
{{- if hasKey $seen $seenKey }}
  {{- fail (printf "routes.%s: two TLS backends produce the BackendConfigPolicy %s; give them distinct names" $routeKey $seenKey) }}
{{- end }}
{{- $_ := set $seen $seenKey true }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: {{ $bcpName }}
  namespace: {{ $bcpNs }}
  labels:
    {{- include "kgateway-routing.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: {{ $target.group | quote }}
      kind: {{ $target.kind }}
      name: {{ $target.name }}
  tls:
    {{- if $backend.sni }}
    sni: {{ $backend.sni }}
    {{- else if $backend.host }}
    sni: {{ $backend.host }}
    {{- else }}
    sni: {{ $backend.name }}
    {{- end }}
    {{- if $backend.insecure }}
    insecureSkipVerify: true
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
