{{- $namespace := include "kgateway-routing.namespace" . -}}
{{- $keys := keys .Values.routes | sortAlpha -}}
{{- range $key := $keys }}
  {{- $cfg := index $.Values.routes $key }}
  {{- if and $cfg.enabled (hasKey $cfg "forwardAuth") }}
    {{- $disabled := and (kindIs "bool" $cfg.forwardAuth) (not $cfg.forwardAuth) }}
    {{- if and (not $disabled) (not $cfg.forwardAuth) }}
      {{- fail (printf "routes.%s.forwardAuth is set but empty; set it to true, false or an object with extensionRef, or remove the key entirely" $key) }}
    {{- end }}
    {{- $name := include "kgateway-routing.routeName" (dict "root" $ "key" $key "config" $cfg) }}
    {{- $routeNamespace := default $namespace $cfg.namespace }}
    {{- $extRef := dict }}
    {{- if $disabled }}
    {{- else if kindIs "bool" $cfg.forwardAuth }}
      {{- if not $.Values.defaultForwardAuth.extensionRef }}
        {{- fail (printf "routes.%s.forwardAuth: true requires .Values.defaultForwardAuth.extensionRef to be set" $key) }}
      {{- end }}
      {{- $extRef = $.Values.defaultForwardAuth.extensionRef }}
    {{- else }}
      {{- $extRef = $cfg.forwardAuth.extensionRef }}
    {{- end }}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ printf "%s-forward-auth" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $routeNamespace }}
  labels:
    {{- include "kgateway-routing.resourceLabels" (dict "root" $ "extra" $cfg.labels) | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $name }}
  extAuth:
    {{- if $disabled }}
    # Overrides an ExtAuth policy attached to the parent Gateway.
    disable: {}
    {{- else }}
    extensionRef:
      name: {{ required (printf "routes.%s.forwardAuth.extensionRef.name (or defaultForwardAuth.extensionRef.name) is required" $key) $extRef.name }}
      {{- if $extRef.namespace }}
      namespace: {{ $extRef.namespace }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
