suite: test cert-manager-platform chart - ReferenceGrant
release:
  name: cert-manager-platform-test
  namespace: cert-manager-platform
templates:
  - templates/referencegrant.yaml
tests:
  # Test with no ReferenceGrants configured (default)
  - it: should not render ReferenceGrants when map is empty
    values:
      - values/default.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Test with ReferenceGrant enabled
  - it: should render ReferenceGrant when grant is configured and enabled
    set:
      referenceGrants:
        allow-kgateway-platform:
          enabled: true
          from:
            - kind: Gateway
              namespace: kgateway-platform
          to:
            - kind: Secret
              name: wildcard-tls
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ReferenceGrant
      - equal:
          path: metadata.name
          value: allow-kgateway-platform
      - equal:
          path: metadata.namespace
          value: cert-manager-platform
      - equal:
          path: spec.from[0].group
          value: gateway.networking.k8s.io
      - equal:
          path: spec.from[0].kind
          value: Gateway
      - equal:
          path: spec.from[0].namespace
          value: kgateway-platform
      - equal:
          path: spec.to[0].group
          value: ""
      - equal:
          path: spec.to[0].kind
          value: Secret
      - equal:
          path: spec.to[0].name
          value: wildcard-tls

  # Without a name the grant would open every Secret of the namespace.
  - it: should fail when a to entry has no name
    set:
      referenceGrants:
        allow-kgateway-platform:
          enabled: true
          from:
            - kind: Gateway
              namespace: kgateway-platform
          to:
            - kind: Secret
    asserts:
      - failedTemplate:
          errorMessage: "referenceGrants.allow-kgateway-platform.to[].name is required: without it the grant opens every Secret of the namespace"

  # Test with ReferenceGrant disabled
  - it: should not render ReferenceGrant when grant is disabled
    set:
      referenceGrants:
        allow-kgateway-platform:
          enabled: false
          from:
            - kind: Gateway
              namespace: kgateway-platform
          to:
            - kind: Secret
              name: wildcard-tls
    asserts:
      - hasDocuments:
          count: 0

  # Test with multiple ReferenceGrants
  - it: should render multiple ReferenceGrants when multiple are configured
    set:
      referenceGrants:
        allow-kgateway-platform:
          enabled: true
          from:
            - kind: Gateway
              namespace: kgateway-platform
          to:
            - kind: Secret
              name: wildcard-tls
        allow-another-namespace:
          enabled: true
          from:
            - kind: HTTPRoute
              namespace: another-namespace
          to:
            - kind: Secret
              name: wildcard-tls
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ReferenceGrant
        documentIndex: 0
      - equal:
          path: metadata.name
          value: allow-another-namespace
        documentIndex: 0
      - isKind:
          of: ReferenceGrant
        documentIndex: 1
      - equal:
          path: metadata.name
          value: allow-kgateway-platform
        documentIndex: 1
