suite: test network-policy chart - values schema
templates:
  - templates/common.yaml
tests:
  - it: should reject an egress entry without why
    set:
      networkPolicy.egress:
        - to: world
          ports: [443]
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/egress/0': missing property 'why'"

  - it: should reject an unknown egress target
    set:
      networkPolicy.egress:
        - to: intranet
          ports: [443]
          why: Typo.
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/egress/0/to'"

  - it: should reject an unknown key
    set:
      networkPolicy.egress:
        - to: world
          port: [443]
          why: Typo.
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'port' not allowed"

  - it: should reject an ingress entry without ports
    set:
      networkPolicy.ingress:
        - from: pods
          why: Missing ports.
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/ingress/0': missing property 'ports'"

  - it: should reject an unknown key under networkPolicy
    set:
      networkPolicy.egres: []
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'egres' not allowed"

  - it: should render nothing when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
