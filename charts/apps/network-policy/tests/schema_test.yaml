suite: test network-policy chart - values schema
templates:
  - templates/ciliumnetworkpolicy.yaml
tests:
  - it: should reject an egress entry without why
    set:
      egress:
        - to: world
          ports: [443]
    asserts:
      - failedTemplate:
          errorPattern: "at '/egress/0': missing property 'why'"

  - it: should reject an unknown egress target
    set:
      egress:
        - to: internet
          ports: [443]
          why: Typo.
    asserts:
      - failedTemplate:
          errorPattern: "at '/egress/0/to'"

  - it: should reject an unknown key
    set:
      egress:
        - to: world
          port: [443]
          why: Typo.
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'port' not allowed"

  - it: should reject an ingress entry without ports
    set:
      ingress:
        - from: pods
          why: Missing ports.
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingress/0': missing property 'ports'"
