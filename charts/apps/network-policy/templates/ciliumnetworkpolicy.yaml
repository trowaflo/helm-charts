{{- $ns := .Release.Namespace }}
{{- $labels := include "network-policy.labels" . }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "network-policy.name" (dict "root" $ "suffix" "baseline") }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  description: Default deny for every pod of the namespace, present or future; the other policies of this release and the cluster-wide baseline open the declared flows.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  # An empty rule turns enforcement on and allows nothing.
  ingress:
    - {}
  egress:
    - {}
{{- range $i, $r := .Values.egress }}
  {{- $ports := $r.ports }}
  {{- if and (not $ports) (eq $r.to "kube-apiserver") }}{{ $ports = list 6443 }}{{ end }}
  {{- if and (not $ports) (eq $r.to "fqdn") }}{{ $ports = list 443 }}{{ end }}
  {{- if and (not $ports) (has $r.to (list "world" "cidr" "pods")) }}
    {{- fail (printf "egress[%d]: to %s needs ports" $i $r.to) }}
  {{- end }}
  {{- if and (eq $r.to "fqdn") (not $r.names) }}
    {{- fail (printf "egress[%d]: to fqdn needs names" $i) }}
  {{- end }}
  {{- if and (eq $r.to "cidr") (not $r.cidrs) }}
    {{- fail (printf "egress[%d]: to cidr needs cidrs" $i) }}
  {{- end }}
  {{- $peerNs := $r.namespace | default $ns }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "network-policy.name" (dict "root" $ "suffix" (printf "egress-%d" $i)) }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  description: {{ $r.why | quote }}
  endpointSelector:
    {{- include "network-policy.selector" $r.select | nindent 4 }}
  egress:
  {{- if eq $r.to "kube-apiserver" }}
    - toEntities:
        - kube-apiserver
  {{- else if eq $r.to "world" }}
    - toEntities:
        - world
  {{- else if eq $r.to "fqdn" }}
    # Matched against the names the pod resolves through the Cilium DNS proxy,
    # turned on for these pods only by the DNS rule below.
    - toFQDNs:
    {{- range $r.names }}
        - matchName: {{ . | quote }}
    {{- end }}
  {{- else if eq $r.to "cidr" }}
    - toCIDR:
        {{- toYaml $r.cidrs | nindent 8 }}
  {{- else if eq $r.to "pods" }}
    - toEndpoints:
        {{- include "network-policy.peer" (dict "selector" $r.selector "namespace" $peerNs) | nindent 8 }}
  {{- end }}
      {{- include "network-policy.ports" (dict "ports" $ports "protocol" $r.protocol) | nindent 6 }}
  {{- if eq $r.to "fqdn" }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
  {{- end }}
  {{- if and (eq $r.to "pods") (eq $peerNs $ns) }}
---
# Same-namespace peer: the receiving side, so one egress entry opens both.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "network-policy.name" (dict "root" $ "suffix" (printf "egress-%d-peer" $i)) }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  description: {{ $r.why | quote }}
  endpointSelector:
    {{- include "network-policy.selector" $r.selector | nindent 4 }}
  ingress:
    - fromEndpoints:
        {{- include "network-policy.peer" (dict "selector" $r.select "namespace" $ns) | nindent 8 }}
      {{- include "network-policy.ports" (dict "ports" $ports "protocol" $r.protocol) | nindent 6 }}
  {{- end }}
{{- end }}
{{- range $i, $r := .Values.ingress }}
  {{- if not $r.ports }}
    {{- fail (printf "ingress[%d]: from %s needs ports" $i $r.from) }}
  {{- end }}
  {{- if and (eq $r.from "cidr") (not $r.cidrs) }}
    {{- fail (printf "ingress[%d]: from cidr needs cidrs" $i) }}
  {{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "network-policy.name" (dict "root" $ "suffix" (printf "ingress-%d" $i)) }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  description: {{ $r.why | quote }}
  endpointSelector:
    {{- include "network-policy.selector" $r.select | nindent 4 }}
  ingress:
  {{- if eq $r.from "pods" }}
    - fromEndpoints:
        {{- include "network-policy.peer" (dict "selector" $r.selector "namespace" ($r.namespace | default $ns)) | nindent 8 }}
  {{- else if eq $r.from "cidr" }}
    - fromCIDR:
        {{- toYaml $r.cidrs | nindent 8 }}
  {{- end }}
      {{- include "network-policy.ports" (dict "ports" $r.ports "protocol" $r.protocol) | nindent 6 }}
{{- end }}
