# yamllint disable rule:line-length
name: Helm Release

on:
  # Manual re-trigger — useful when a squash & merge embedded [skip ci] in the
  # commit body (e.g. auto-bump/helm-docs bots) and suppressed the auto-release
  # on push to main.
  # No pull_request trigger: this job holds contents/pages/packages write, so
  # a PR must never reach it.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions: {}

jobs:
  helm-release:
    name: Helm Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not workflow-level: in a called workflow, workflow-level concurrency
    # applies to the caller's run. Never cancelled: a release cut in the middle can
    # leave a GitHub release without its index entry or OCI copy.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release-helm
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      packages: write
    env:
      # Built-in harden-runner allowed endpoints:
      #   agent.api.stepsecurity.io:443 — harden-runner agent
      #   api.github.com:443 — GitHub API (chart-releaser)
      #   get.helm.sh:443 — Helm binary (azure/setup-helm)
      #   ghcr.io:443 — OCI chart registry (used when enable_oci_release is true)
      #   github.com:443 — git clone, actions checkout
      #   objects.githubusercontent.com:443 — GitHub release assets (yq binary)
      #   rekor.sigstore.dev:443 — Sigstore transparency log (cosign verification)
      #   release-assets.githubusercontent.com:443 — GitHub release downloads (yq checksums)
      #   tuf-repo-cdn.sigstore.dev:443 — Sigstore TUF metadata (cosign verification)
      #   uploads.github.com:443 — GitHub release uploads (chart-releaser)
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        get.helm.sh:443
        ghcr.io:443
        github.com:443
        objects.githubusercontent.com:443
        rekor.sigstore.dev:443
        release-assets.githubusercontent.com:443
        tuf-repo-cdn.sigstore.dev:443
        uploads.github.com:443
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Determine release directories
        id: dirs
        env:
          RELEASE_DIRS: "charts/library charts/apps"
        run: |
          DIRS="${RELEASE_DIRS:-charts}"
          count=$(echo "$DIRS" | wc -w | tr -d ' ')
          if [ "$count" -gt 2 ]; then
            echo "::warning::release_charts_dirs contains $count directories but only 2 are supported."
          fi
          echo "first=$(echo "$DIRS" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "second=$(echo "$DIRS" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Install yq with checksum verification
        run: |
          set -euo pipefail
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION="v4.44.2"
          YQ_ASSET="yq_linux_amd64"
          BASE_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          curl -fsSL -o "$TMP_DIR/$YQ_ASSET" "${BASE_URL}/${YQ_ASSET}"
          curl -fsSL -o "$TMP_DIR/checksums" "${BASE_URL}/checksums"
          curl -fsSL -o "$TMP_DIR/checksums_hashes_order" "${BASE_URL}/checksums_hashes_order"
          SHA256_COL=$(( $(grep -n '^SHA-256$' "$TMP_DIR/checksums_hashes_order" | cut -d: -f1) + 1 ))
          SHA256_HASH=$(grep "^${YQ_ASSET}[[:space:]]" "$TMP_DIR/checksums" | sed 's/  /\t/g' | cut -f"$SHA256_COL")
          echo "${SHA256_HASH}  ${YQ_ASSET}" > "$TMP_DIR/${YQ_ASSET}.sha256"
          (cd "$TMP_DIR" && sha256sum -c "${YQ_ASSET}.sha256")
          install -m 0755 "$TMP_DIR/$YQ_ASSET" /usr/local/bin/yq
      - name: Add external Helm repositories
        env:
          DIR_FIRST: ${{ steps.dirs.outputs.first }}
          DIR_SECOND: ${{ steps.dirs.outputs.second }}
        run: |
          repos_added=0
          for dir in $DIR_FIRST $DIR_SECOND; do
            [ -z "$dir" ] && continue
            for chart_dir in "$dir"/*/; do
              chart_file="$chart_dir/Chart.yaml"
              [ -f "$chart_file" ] || continue
              while IFS=$'\t' read -r repo_name repo_url; do
                if [ -n "$repo_name" ] && [ -n "$repo_url" ] && [ "$repo_url" != "null" ]; then
                  helm repo add "$repo_name" "$repo_url" 2>/dev/null || true
                  repos_added=$((repos_added + 1))
                fi
              done < <(yq '.dependencies[] | select(.repository | test("^https?://")) | [.name, .repository] | @tsv' "$chart_file" 2>/dev/null || true)
            done
          done
          if [ "$repos_added" -gt 0 ]; then helm repo update; fi
      - name: Build dependencies (first)
        env:
          DIR_FIRST: ${{ steps.dirs.outputs.first }}
        run: |
          for chart in "$DIR_FIRST"/*/; do
            if [ -f "$chart/Chart.yaml" ]; then helm dependency build "$chart"; fi
          done
      - name: Release first directory
        id: release_first
        if: ${{ github.event_name != 'pull_request' }}
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: ${{ steps.dirs.outputs.first }}
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: true
          CR_GENERATE_RELEASE_NOTES: true
      - name: Publish first directory to OCI registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && steps.release_first.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pkg_dir=".cr-release-packages"
          if [ ! -d "$pkg_dir" ] || [ -z "$(ls -A "$pkg_dir" 2>/dev/null)" ]; then
            echo "No release packages produced by chart-releaser — nothing to push to OCI."
            exit 0
          fi
          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          repo_name_lc=$(echo "${REPO#*/}" | tr '[:upper:]' '[:lower:]')
          target="oci://ghcr.io/${owner_lc}/${repo_name_lc}"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          trap 'helm registry logout ghcr.io >/dev/null 2>&1 || true' EXIT
          for tgz in "$pkg_dir"/*.tgz; do
            [ -f "$tgz" ] || continue
            echo "Pushing $(basename "$tgz") → ${target}"
            helm push "$tgz" "${target}"
          done
          rm -rf "$pkg_dir"
      - name: Add self as Helm repository
        if: ${{ steps.dirs.outputs.second != '' }}
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          helm repo add self "https://${REPO_OWNER}.github.io/${REPO_NAME}" || true
          helm repo update
      - name: Build dependencies (second)
        if: ${{ steps.dirs.outputs.second != '' }}
        env:
          DIR_SECOND: ${{ steps.dirs.outputs.second }}
        run: |
          for chart in "$DIR_SECOND"/*/; do
            if [ -f "$chart/Chart.yaml" ]; then helm dependency build "$chart"; fi
          done
      - name: Release second directory
        id: release_second
        if: ${{ steps.dirs.outputs.second != '' && github.event_name != 'pull_request' }}
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: ${{ steps.dirs.outputs.second }}
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: true
          CR_GENERATE_RELEASE_NOTES: true
      - name: Publish second directory to OCI registry (GHCR)
        if: ${{ steps.dirs.outputs.second != '' && github.event_name != 'pull_request' && steps.release_second.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pkg_dir=".cr-release-packages"
          if [ ! -d "$pkg_dir" ] || [ -z "$(ls -A "$pkg_dir" 2>/dev/null)" ]; then
            echo "No release packages produced by chart-releaser — nothing to push to OCI."
            exit 0
          fi
          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          repo_name_lc=$(echo "${REPO#*/}" | tr '[:upper:]' '[:lower:]')
          target="oci://ghcr.io/${owner_lc}/${repo_name_lc}"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          trap 'helm registry logout ghcr.io >/dev/null 2>&1 || true' EXIT
          for tgz in "$pkg_dir"/*.tgz; do
            [ -f "$tgz" ] || continue
            echo "Pushing $(basename "$tgz") → ${target}"
            helm push "$tgz" "${target}"
          done
          rm -rf "$pkg_dir"
