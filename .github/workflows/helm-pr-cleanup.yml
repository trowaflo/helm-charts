name: Helm PR Cleanup

on:
  pull_request:
    types: [closed]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    uses: trowaflo/github-actions/.github/workflows/ci-helm-cleanup.yml@745d89e5792c3f9dd0c62e33a1065afd2eadc7a7 # v3.0.0
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      enable_oci_cleanup: true
    secrets:
      OCI_CLEANUP_TOKEN: ${{ secrets.OCI_CLEANUP_TOKEN }}
